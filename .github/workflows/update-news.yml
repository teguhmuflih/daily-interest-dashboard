name: Perbarui kandidat berita
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d67c8eacb7e1b4a5f30d9c7b3b # v4
        with:
          node-version: '22'
      - run: node scripts/ingest.js
      - name: Commit kandidat bila berubah
        run: |
          git config user.name "daily-interest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json
          git diff --cached --quiet || git commit -m "data: refresh news candidates"
          git push
